<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TeethLink prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><style>
:root{--g:#A9D4F5;--gd:#2570B8;--m:#F1F8FE;--mb:#D6E8F8;--w:#fff;--tx:#10243A;--gr:#5B6B7C;--ln:#E1EBF5;--red:#B42318;--amb:#8A4B0A;--ok:#166534;--bg:#F4F9FE;--sh:0 1px 2px rgba(16,36,58,.05);color-scheme:light}
@media not all{:root:not([data-theme=light]){--bg:#0f1a14}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 6px;align-items:center;justify-content:center}.bar button,.bar select{font:500 13px Inter,system-ui,sans-serif;padding:7px 12px;border-radius:8px;border:1px solid #c9dff2;background:#fff;color:var(--gd);cursor:pointer}.bar button.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.note{text-align:center;font-size:12px;color:var(--gr);padding:0 14px 10px}
.ph{width:390px;max-width:100%;height:780px;margin:0 auto 24px;background:var(--w);border-radius:36px;border:8px solid #C9DDF0;overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph.web{width:860px;height:720px;border-radius:14px;border-width:6px}
.sc{flex:1;overflow:auto;padding:20px 20px 24px}.i{flex:none;vertical-align:middle}
.h{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:17px;font-weight:600}.h a{display:grid;place-items:center;width:32px;height:32px;margin-left:-8px;color:var(--tx);cursor:pointer}.h a svg{width:22px;height:22px}.h .sp{flex:1}
h2{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:4px 0 6px}h3{font-size:15px;font-weight:600;margin:22px 0 10px}p{margin:3px 0;color:var(--gr);font-size:14px}small{color:var(--gr);font-size:12.5px}
.c{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin:10px 0;box-shadow:var(--sh)}.c[data-go],.c[data-do]{cursor:pointer}.c.m{background:var(--m);border-color:var(--mb);box-shadow:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .c{margin:0}
.ic{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--m);color:var(--gd);border:1px solid var(--mb);margin-bottom:12px}.ic svg{width:20px;height:20px}.row .ic{margin-bottom:0}
.st b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em}.st p{margin:2px 0 0;font-size:13px}
.b{display:flex;align-items:center;justify-content:center;width:100%;height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--gd);background:var(--gd);color:#fff;font-family:inherit;font-weight:600;font-size:15px;margin:12px 0 0;cursor:pointer;text-align:center}.b.s{background:var(--m);color:var(--gd);border-color:var(--mb)}.b.o{background:#fff;color:var(--gd);border-color:#c9dff2}.b.d{background:#fff;color:var(--red);border-color:#f0cdc9}.b:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-weight:500;font-size:13px;margin:14px 0 6px}input,textarea,select.f{width:100%;font:inherit;height:46px;padding:0 14px;border:1px solid #d3e2f1;border-radius:12px;background:#fff;color:var(--tx)}textarea{height:auto;min-height:96px;padding:12px 14px}input:focus,textarea:focus,select.f:focus{outline:0;border-color:var(--gd);box-shadow:0 0 0 3px rgba(169,212,245,.6)}.err{color:var(--red);font-size:13px;margin-top:6px}
.sf{position:relative}.sf svg{position:absolute;left:14px;top:14px;color:var(--gr);width:18px;height:18px}.sf input{padding-left:42px}
.bd{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;margin-top:2px}.bd.g{background:#E3F0FC;color:#1D5C99}.bd.a{background:#FDF3DC;color:var(--amb)}.bd.r{background:#FCE9E7;color:var(--red)}.bd.b{background:#ECEFFA;color:#3F4A8A}
.tab{display:flex;border-top:1px solid var(--ln);background:#fff;padding-bottom:6px}.tab a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 4px;font-size:11px;font-weight:500;color:var(--gr);cursor:pointer}.tab a.on{color:var(--gd);font-weight:600}.tab i{display:block;height:22px;font-style:normal}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row>div:first-child{flex:1}
.bub{max-width:84%;padding:10px 13px;border-radius:14px;margin:8px 0;font-size:14.5px}.bub.u{background:var(--gd);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.bub.a{background:#F3F8FD;border:1px solid var(--ln);border-bottom-left-radius:4px}
.chip{display:inline-block;padding:8px 12px;border:1px solid #c9dff2;border-radius:8px;margin:4px 6px 0 0;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--gd)}
.ring{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gd) calc(var(--p)*1%),var(--mb) 0)}.ring div{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:650;font-size:24px;letter-spacing:-.02em}
.bar2{height:6px;background:var(--mb);border-radius:9px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--gd)}
.tl{border-left:2px solid var(--mb);margin:12px 0 12px 6px;padding-left:16px}.tl div{margin:0 0 12px}.tl .x{color:var(--gr);font-size:13px}
.mod{position:absolute;inset:0;background:rgba(16,36,58,.4);display:grid;place-items:center;padding:20px;z-index:5}.mod .c{margin:0;width:100%}
.dot{display:inline-block;width:7px;height:7px;border-radius:9px;background:var(--gr);margin-right:4px;animation:p 1s infinite}@keyframes p{50%{opacity:.2}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln)}th{color:var(--gr);font-weight:500}
.sw{width:40px;height:22px;border-radius:99px;background:#cfdbe8;position:relative;display:inline-block;cursor:pointer}.sw.on{background:var(--gd)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:9px;background:#fff}.sw.on:after{left:21px}
[dir=rtl] .h a{margin:0 -8px 0 0}[dir=rtl] .sf svg{left:auto;right:14px}[dir=rtl] .sf input{padding:0 42px 0 14px}[dir=rtl] .tl{border-left:0;border-right:2px solid var(--mb);margin:12px 6px 12px 0;padding:0 16px 0 0}[dir=rtl] th,[dir=rtl] td{text-align:right}.logo{width:64px;height:64px;border-radius:18px;background:var(--m);border:1px solid var(--mb);color:var(--gd);display:grid;place-items:center;margin:48px auto 16px}.logo svg{width:30px;height:30px}
.ib{width:48px;flex:none;padding:0;margin:0}.ib svg{width:20px;height:20px}
</style></head><body>
<div class="bar" id="bar"></div><div class="note">Prototype only, four roles (patient, student, supervisor, admin): no real authentication, AI, database, notifications or concurrent reservation. Sample data throughout. Supervisor screens are designed as a web dashboard.</div>
<div class="ph" id="ph"></div>
<script>
const P={'tooth': '<path d="M8 3c-2.8 0-5 2.2-5 5.2 0 2.3 1 3.6 1.5 6.2.4 2.4 1 6.6 2.7 6.6 1.6 0 1.5-4 3.8-4s2.2 4 3.8 4c1.7 0 2.3-4.2 2.7-6.6.5-2.6 1.5-3.9 1.5-6.2C21 5.2 18.8 3 16 3c-1.7 0-2.7 1-4 1S9.7 3 8 3z"/>', 'home': '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>', 'clipboard': '<rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M9 13h6M9 17h4"/>', 'user': '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', 'bell': '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>', 'search': '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', 'msg': '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', 'shield': '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>', 'grad': '<path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>', 'checkc': '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>', 'clock': '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 'calendar': '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', 'lock': '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', 'file': '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>', 'send': '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>', 'cr': '<path d="m9 6 6 6-6 6"/>', 'cl': '<path d="m15 6-6 6 6 6"/>', 'steth': '<path d="M5 3v6a5 5 0 0 0 10 0V3"/><path d="M10 14v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="12" r="2"/>', 'drop': '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>', 'layers': '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>', 'grid': '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>', 'star': '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'};
const I=(n,z=20,f)=>`<svg class="i" width="${z}" height="${z}" viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const S={id:'splash',svc:'Initial Dental Examination',desc:'',loc:'',time:'',err:'',chat:[],typing:false,modal:null,lost:false,perm:{'Initial Examination':1,'Teeth Cleaning':1,'Dental Filling':0}};
const ST={wait:['Waiting for Student','a'],res:['Reserved / Awaiting Patient','a'],conf:['Confirmed','g'],done:['Completed','g'],fu:['Needs Follow-up','b'],can:['Cancelled','r'],rej:['Rejected / Expired','r'],pend:['Pending Approval','a'],val:['Validated by supervisor','g'],rev:['Awaiting supervisor review','a'],appr:['Approved','g']};
const bd=k=>`<span class="bd ${ST[k][1]}">${ST[k][0]}</span>`;
const B=(t,go,c='')=>`<button class="b ${c}" data-go="${go}">${t}</button>`;
const H=(t,back,r='')=>`<div class="h">${back?`<a data-go="${back}" aria-label="Back">{{i:cl}}</a>`:''}<b>${t}</b><span class="sp"></span>${r}</div>`;
const F=(l,ph,k,t='text')=>`<label>${l}</label><input type="${t}" placeholder="${ph}" ${k?`data-k="${k}" value="${S[k]||''}"`:''}>`;
const C=(h,go='',c='')=>`<div class="c ${c}" ${go?`data-go="${go}"`:''}>${h}</div>`;
const SVCS=[['{{i:steth}}','Initial Dental Examination','A first check of your teeth and gums.'],['{{i:drop}}','Teeth Cleaning','Removes plaque and tartar.'],['{{i:layers}}','Dental Filling','Repairs a cavity or small chip.'],['{{i:grid}}','Other approved services','See everything currently offered.']];
const TABS={patient:[['Home','{{i:home}}','p_home'],['My Requests','{{i:clipboard}}','p_reqs'],['Profile','{{i:user}}','p_prof']],student:[['Home','{{i:home}}','s_dash'],['Active Cases','{{i:clipboard}}','s_active'],['Profile','{{i:user}}','s_prof']]};
const NAVMAP={p_home:0,p_reqs:1,p_prof:2,p_detail:1,p_notif:0,s_dash:0,s_cases:0,s_active:1,s_apt:1,s_hist:1,s_prof:2,s_svc:2};
const bell=`<a data-go="p_notif" style="display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--ln);border-radius:10px;color:var(--tx);cursor:pointer" aria-label="Notifications">{{i:bell}}</a>`;
const stars=n=>Array.from({length:5},(_,i)=>I('star',16,i<n)).join('');
const SC={
splash:()=>`<div class="logo" style="margin-top:80px">{{i:tooth}}</div><h2 style="text-align:center">TeethLink</h2><p style="text-align:center">Dental care from supervised dental students.</p><div style="height:150px"></div>${B('Get started','entry')}`,
entry:()=>`${H('Welcome','splash')}<h2>Who are you?</h2><p>Choose your role to continue.</p>${C('<span class="ic">{{i:user}}</span><b>I am a patient</b><p>Request dental care.</p>','p_signup')}${C('<span class="ic">{{i:grad}}</span><b>I am a dental student</b><p>Register and take cases.</p>','s_reg')}${C('<span class="ic">{{i:shield}}</span><b>Supervisor</b><p>Web dashboard (shown at desktop width).</p>','a_reg')}${C('<span class="ic">{{i:users}}</span><b>Admin</b><p>Web dashboard: accounts, services, audit log.</p>','m_dash')}<p style="text-align:center;margin-top:14px">Already have an account? <a data-go="p_login" style="color:var(--gd);font-weight:700;cursor:pointer">Log in</a></p>`,
p_signup:()=>`${H('Create account','entry')}${F('Full name','Sara Ahmed','')}${F('Phone','+20 10 0000 0000','','tel')}${F('Email','sara@example.com','','email')}${F('Password','At least 8 characters','','password')}${F('Age or area (optional)','e.g. 29, Giza','')}${B('Sign up','p_home')}`,
p_login:()=>`${H('Log in','entry')}${F('Email','sara@example.com','','email')}${F('Password','Your password','','password')}${B('Log in','p_home')}`,
p_home:()=>`${H('Hello, Sara','',bell)}<div class="sf">{{i:search}}<input placeholder="Search dental services" aria-label="Search"></div><h3>Dental Services</h3><div class="g2">${SVCS.map(s=>`<div class="c" data-do="svc" data-v="${s[1]}"><div class="row"><span class="ic">${s[0]}</span><span style="color:var(--gr)">{{i:cr}}</span></div><b>${s[1]}</b><p style="font-size:13px">${s[2]}</p></div>`).join('')}</div><div class="c row" data-go="p_chatintro" style="margin-top:14px"><span class="ic">{{i:msg}}</span><div style="flex:1"><b>AI Assistant</b><p>Not sure which service? Describe it and get preliminary guidance.</p></div><span style="color:var(--gr)">{{i:cr}}</span></div><h3>Active requests</h3>${C(`<b>CASE-1031 · Teeth Cleaning</b><br>${bd('res')}<p>A student proposed an appointment. Please respond.</p>`,'p_detail')}`,
p_svc:()=>`${H('Service details','p_home')}<div class="c m"><span class="ic">{{i:tooth}}</span><h2>${S.svc}</h2><p>A short visit with a supervised dental student. A supervisor oversees the student’s work.</p></div><h3>What to expect</h3><p>1. Describe the problem.<br>2. A student proposes a time and place.<br>3. You accept, or ask for another time.</p>${B('Request this service','p_create')}`,
p_create:()=>`${H('Create request','p_svc')}<div class="c m"><small>Service</small><br><b>${S.svc}</b></div><label>What is the problem? *</label><textarea data-k="desc" placeholder="e.g. Pain in a lower tooth when I drink cold water">${S.desc}</textarea>${S.err?`<div class="err">${S.err}</div>`:''}${F('Preferred location (optional)','Area or district','loc')}${F('Preferred time (optional)','e.g. Weekday mornings','time')}<button class="b" data-do="review">Review request</button><p style="text-align:center">Or <a data-go="p_chatintro" style="color:var(--gd);font-weight:700;cursor:pointer">ask the AI assistant</a> to help you describe it.</p>`,
p_review:()=>`${H('Review request','p_create')}${C(`<small>Service</small><br><b>${S.svc}</b><br><br><small>Description</small><br>${S.desc||'Pain in a lower tooth when I drink cold water.'}<br><br><small>Location · Time</small><br>${S.loc||'Not specified'} · ${S.time||'Not specified'}`)}<p>Your phone number is shared only after you confirm an appointment.</p>${B('Confirm and submit','p_done')}${B('Edit','p_create','o')}`,
p_done:()=>`<div class="logo" style="margin-top:50px">{{i:checkc}}</div><h2 style="text-align:center">Request submitted</h2><p style="text-align:center">Your case reference</p><h2 style="text-align:center;color:var(--gd)">CASE-1042</h2><p style="text-align:center">Status: ${bd('wait')}</p><p style="text-align:center">We notify you when a student proposes an appointment.</p>${B('Track in My Requests','p_reqs')}`,
p_chatintro:()=>`${H('AI Assistant','p_home')}<div class="logo" style="margin-top:20px">{{i:msg}}</div><h2 style="text-align:center">I can help you describe it</h2><p style="text-align:center">I ask a few questions and organize your answer. You choose the service. I do not diagnose or decide treatment.</p>${C('<b>Preliminary guidance only.</b> Only a dentist can assess your teeth.','','m')}${B('Start chat','p_chat')}`,
p_chat:()=>{const u=S.chat.filter(m=>m[0]=='u').length;return `${H('AI Assistant','p_chatintro')}<div id="msgs"><div class="bub a">Hi Sara. Tell me what is bothering you. I will ask follow-up questions if I need more detail.</div>${S.chat.map(m=>`<div class="bub ${m[0]}">${m[1]}</div>`).join('')}${S.typing?'<div class="bub a"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>':''}</div>${S.chat.length?'':`<div>${['My tooth hurts with cold drinks','I need a checkup','My teeth look yellow','I am not sure'].map(t=>`<span class="chip" data-do="ask" data-v="${t}">${t}</span>`).join('')}</div>`}${u>=2?B('Review summary','p_summary'):''}<div class="row" style="margin-top:14px;gap:8px"><input id="ci" placeholder="Type a message" aria-label="Message"><button class="b ib" data-do="send" aria-label="Send message">{{i:send}}</button></div><small>Preliminary guidance, not a medical diagnosis.</small>`},
p_summary:()=>`${H('Your request summary','p_chat')}<p>Edit anything that is wrong before you continue.</p>${C(`<small>Concern you described</small><br><b>Sensitivity to cold in a lower tooth, for about 2 weeks</b><br><br><small>Suggested service (you decide)</small><br><b>Initial Dental Examination</b><br><br><small>Preferred time</small><br>Weekday mornings<br><br><small>Still missing</small><br>Location`)}<small>This is a summary of your own words, not a diagnosis.</small>${B('Confirm and continue','p_review')}${B('Edit details','p_create','o')}`,
p_reqs:()=>`${H('My Requests')}${[['CASE-1042 · Initial Examination','wait','p_detail'],['CASE-1031 · Teeth Cleaning','res','p_detail'],['CASE-1024 · Dental Filling','conf','p_conf'],['CASE-1019 · Teeth Cleaning','done','p_fb'],['CASE-1012 · Initial Examination','fu','p_detail'],['CASE-1005 · Dental Filling','rej','p_detail'],['CASE-0998 · Teeth Cleaning','can','p_detail']].map(r=>C(`<b>${r[0]}</b><br>${bd(r[1])}${r[1]=='done'?'<p>Tap to rate your visit</p>':''}`,r[2])).join('')}`,
p_detail:()=>`${H('CASE-1031','p_reqs')}<div class="c m"><b>Teeth Cleaning</b><br>${bd('res')}<p>A student proposed an appointment. It is not confirmed until you accept.</p></div><div class="tl"><div>Request submitted<br><span class="x">Oct 22, 09:10</span></div><div>Student reserved the case<br><span class="x">Oct 23, 14:02</span></div><div><b>Your response needed</b><br><span class="x">Reply by Oct 24, 14:02 (24 h, prototype assumption)</span></div></div>${B('View proposed appointment','p_prop')}${B('Cancel request','p_cancel','d')}<h3>All statuses</h3>${['wait','aw','res','conf','rev','done','fu','can','rej'].map(bd).join(' ')}`,
p_cancel:()=>`${H('Cancel request','p_detail')}<p>You can cancel until the visit is completed. The student is notified.</p>${C('Cancelling CASE-1031 cannot be undone.','','m')}<button class="b d" data-do="modal" data-v="Cancel CASE-1031?|The case becomes Cancelled and the student is notified.|p_reqs">Cancel request</button>${B('Keep request','p_detail','o')}`,
p_prop:()=>`${H('Proposed appointment','p_detail')}<div class="c m"><b>Thu, Oct 29 · 10:30</b><p>Faculty of Dentistry, Clinic 3</p><p>Student: Omar K., Year 5</p>${bd('res')}</div><p>This is a proposal. It becomes confirmed only after you accept.</p>${B('Accept appointment','p_conf')}${B('Request another appointment','p_alt','o')}<button class="b d" data-do="modal" data-v="Reject this appointment?|The case returns to the available list for other eligible students.|p_reqs">Reject appointment</button>`,
p_alt:()=>`${H('Request another time','p_prop')}<p>Policy assumption: the same student proposes a new time. If you cannot agree, the case returns to the available list.</p>${F('Times that work for you','e.g. Sunday after 4 pm','')}${B('Send request','p_reqs')}`,
p_conf:()=>`<div class="logo" style="margin-top:40px">{{i:calendar}}</div><h2 style="text-align:center">Booking confirmed</h2><div class="c m"><b>Thu, Oct 29 · 10:30</b><p>Faculty of Dentistry, Clinic 3<br>CASE-1031 · Teeth Cleaning</p>${bd('conf')}</div><p style="text-align:center">You and the student received a confirmation. A reminder is sent before the visit.</p>${B('Back to My Requests','p_reqs')}`,

document.addEventListener('click',e=>{const d=e.target.closest('[data-do]'),g=e.target.closest('[data-go]');
 if(d){const a=d.dataset.do,v=d.dataset.v;
  if(a=='svc'){S.svc=v;S.id='p_svc'}
  else if(a=='review'){if(S.desc.trim().length<10){S.err='Please describe the problem in at least 10 characters.';}else S.id='p_review'}

  else if(a=='send'){const i=document.getElementById('ci');return send(i.value)}
  else if(a=='modal'){S.modal=v.split('|')}
  else if(a=='close'){S.modal=null}
  else if(a=='lost'){S.lost=true}
  else if(a=='tog'){S.perm[v]=S.perm[v]?0:1}
  return render()}

p_doc:()=>`${H('Student profile','p_prop')}<div class="c m"><div style="display:flex;gap:14px;align-items:center">${av('Omar Khaled',1)}<div><b>Omar Khaled</b><p>Dental student, Year 5</p><small>Cairo University, Faculty of Dentistry</small></div></div><p style="margin-top:10px">Supervisor: Dr. Nadia Samir (ID 4)</p><span class="bd g">Supervisor approved</span></div><div class="g2"><div class="c st"><b>8</b><p>Validated cases</p></div><div class="c st"><b>4.7</b><p>Patient rating</p></div></div><h3>Approved services</h3><div class="c">${Object.keys(S.perm).filter(k=>S.perm[k]).join(', ')}</div><h3>Case history</h3>${S.posts.map(p=>pcard(p)).join('')}${C(`<div class="row"><b>CASE-1027 · Initial Examination</b>${bd('val')}</div>${ba()}<p>Exam and treatment plan completed. Approved by Dr. Nadia.</p>`)}`
});
document.addEventListener('click',e=>{const d=e.target.closest('[data-do]');if(!d)return;const a=d.dataset.do,v=d.dataset.v;
 if(a=='cd')S.cd=+v;else if(a=='ct')S.ct=v;
 else if(a=='sendp'){if(!S.cd||!S.ct){S.err='Pick a day and a time first.'}else{S.err='';S.appt=DN[(S.cd-1)%7]+', Nov '+S.cd+' · '+S.ct;S.id='s_wait'}}
 else return;
 render()});
render();
</script></body></html>
