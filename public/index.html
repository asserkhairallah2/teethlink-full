<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TeethLink — Dental Matching System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --g: #A9D4F5;
      --gd: #2570B8;
      --m: #F1F8FE;
      --mb: #D6E8F8;
      --w: #fff;
      --tx: #10243A;
      --gr: #5B6B7C;
      --ln: #E1EBF5;
      --red: #B42318;
      --amb: #8A4B0A;
      --ok: #166534;
      --bg: #F4F9FE;
      --sh: 0 1px 3px rgba(16,36,58,.08), 0 4px 6px -2px rgba(16,36,58,.04);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14.5px/1.5 Inter, 'Cairo', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--tx);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    [dir="rtl"] body {
      font-family: 'Cairo', Inter, system-ui, sans-serif;
    }
    .top-nav {
      background: #fff;
      border-bottom: 1px solid var(--ln);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 1px 2px rgba(16,36,58,.04);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      color: var(--gd);
      cursor: pointer;
    }
    .brand svg { width: 28px; height: 28px; color: var(--gd); }
    .bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .bar button {
      font: 600 13px inherit;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #c9dff2;
      background: #fff;
      color: var(--gd);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .15s ease;
    }
    .bar button:hover { background: var(--m); }
    .bar button.on {
      background: var(--gd);
      color: #fff;
      border-color: var(--gd);
      box-shadow: 0 2px 4px rgba(37,112,184,.25);
    }
    .bar button.pill-schema {
      background: #EFF6FF;
      color: #1E40AF;
      border-color: #BFDBFE;
    }
    .bar button.pill-schema.on {
      background: #1E40AF;
      color: #fff;
      border-color: #1E40AF;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      background: #ECFDF5;
      color: var(--ok);
      border: 1px solid #A7F3D0;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    .main-wrap {
      flex: 1;
      padding: 20px 14px 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Framing based on TeethLink prototype(1).html */
    .ph {
      width: 410px;
      max-width: 100%;
      height: 800px;
      background: var(--w);
      border-radius: 36px;
      border: 8px solid #C9DDF0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(16,36,58,.1), 0 8px 10px -6px rgba(16,36,58,.1);
      transition: width .25s ease;
    }
    .ph.web {
      width: 980px;
      height: 800px;
      border-radius: 16px;
      border-width: 6px;
    }
    .ph.wide {
      width: 1560px;
      max-width: 98vw;
      min-height: 880px;
      height: auto;
      border-radius: 16px;
    }

    .sc {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px 24px;
    }
    .h {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 17px;
      font-weight: 600;
    }
    .h a {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      margin-inline-start: -8px;
      color: var(--tx);
      cursor: pointer;
      border-radius: 8px;
    }
    .h a:hover { background: var(--m); }
    .h .sp { flex: 1; }
    h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 6px; color: var(--tx); }
    h3 { font-size: 15px; font-weight: 600; margin: 20px 0 10px; color: var(--tx); }
    p { margin: 4px 0; color: var(--gr); font-size: 14px; }
    small { color: var(--gr); font-size: 12.5px; }

    .c {
      background: #fff;
      border: 1px solid var(--ln);
      border-radius: 14px;
      padding: 16px;
      margin: 10px 0;
      box-shadow: var(--sh);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .c[data-go], .c[data-do] { cursor: pointer; }
    .c[data-go]:hover, .c[data-do]:hover { border-color: var(--gd); }
    .c.m { background: var(--m); border-color: var(--mb); box-shadow: none; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .g2 .c { margin: 0; }
    .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .g4 .c { margin: 0; }

    .ic {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--m);
      color: var(--gd);
      border: 1px solid var(--mb);
      margin-bottom: 12px;
    }
    .ic svg { width: 22px; height: 22px; }
    .row .ic { margin-bottom: 0; }
    .st b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--gd); }
    .st p { margin: 2px 0 0; font-size: 13px; color: var(--gr); }

    .b {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 46px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid var(--gd);
      background: var(--gd);
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 14.5px;
      margin: 12px 0 0;
      cursor: pointer;
      text-align: center;
      transition: all .15s ease;
    }
    .b:hover { opacity: .92; }
    .b.s { background: var(--m); color: var(--gd); border-color: var(--mb); }
    .b.o { background: #fff; color: var(--gd); border-color: #c9dff2; }
    .b.o:hover { background: var(--m); }
    .b.d { background: #fff; color: var(--red); border-color: #f0cdc9; }
    .b.d:hover { background: #FCE9E7; }
    .b:disabled { opacity: .45; cursor: not-allowed; }

    label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; color: var(--tx); }
    input, textarea, select.f {
      width: 100%;
      font: inherit;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #d3e2f1;
      border-radius: 12px;
      background: #fff;
      color: var(--tx);
      transition: border-color .15s, box-shadow .15s;
    }
    textarea { height: auto; min-height: 90px; padding: 12px 14px; }
    input:focus, textarea:focus, select.f:focus {
      outline: 0;
      border-color: var(--gd);
      box-shadow: 0 0 0 3px rgba(169,212,245,.6);
    }
    .err { color: var(--red); font-size: 13px; margin-top: 6px; font-weight: 500; }
    .success-msg { color: var(--ok); font-size: 13px; margin-top: 6px; font-weight: 500; }

    .bd {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
    }
    .bd.g { background: #E3F0FC; color: #1D5C99; }
    .bd.a { background: #FDF3DC; color: var(--amb); }
    .bd.r { background: #FCE9E7; color: var(--red); }
    .bd.ok { background: #ECFDF5; color: var(--ok); }

    .tab {
      display: flex;
      border-top: 1px solid var(--ln);
      background: #fff;
      padding-bottom: 6px;
    }
    .tab a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 0 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--gr);
      cursor: pointer;
    }
    .tab a.on { color: var(--gd); font-weight: 600; }
    .tab i { display: block; height: 22px; font-style: normal; }

    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .row > div:first-child { flex: 1; }
    .chip {
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid #c9dff2;
      border-radius: 8px;
      margin: 4px 6px 4px 0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: #fff;
      color: var(--gd);
      transition: all .15s;
    }
    .chip:hover { background: var(--m); }
    .chip.on { background: var(--gd); color: #fff; border-color: var(--gd); }

    .ring {
      flex: none;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--gd) calc(var(--p)*1%), var(--mb) 0);
    }
    .ring div {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -.02em;
    }
    .bar2 { height: 6px; background: var(--mb); border-radius: 9px; overflow: hidden; margin: 6px 0; }
    .bar2 i { display: block; height: 100%; background: var(--gd); }

    .mod {
      position: absolute;
      inset: 0;
      background: rgba(16,36,58,.45);
      backdrop-filter: blur(2px);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 50;
    }
    .mod .c { margin: 0; width: 100%; max-width: 480px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--ln); }
    [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
    th { color: var(--gr); font-weight: 600; background: #fafcfe; }
    tr:hover td { background: #fbfdff; }

    .sw {
      width: 42px;
      height: 24px;
      border-radius: 99px;
      background: #cfdbe8;
      position: relative;
      display: inline-block;
      cursor: pointer;
      transition: background .2s;
    }
    .sw.on { background: var(--gd); }
    .sw:after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: left .2s;
    }
    .sw.on:after { left: 21px; }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--m);
      border: 1px solid var(--mb);
      color: var(--gd);
      display: grid;
      place-items: center;
      margin: 40px auto 16px;
    }
    .logo svg { width: 32px; height: 32px; }
    .demo-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin: 12px 0;
      padding: 10px;
      background: #F8FAFC;
      border-radius: 10px;
      border: 1px dashed #CBD5E1;
    }
    .demo-bar small { font-weight: 600; color: #475569; width: 100%; margin-bottom: 2px; }
    .demo-pill {
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #CBD5E1;
      cursor: pointer;
      color: #334155;
      font-weight: 500;
    }
    .demo-pill:hover { border-color: var(--gd); color: var(--gd); }

    /* Schema viewer styling */
    .schema-viewer-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .schema-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ln);
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .schema-frame {
      position: relative;
      background: #F8FAFC;
      border: 1px solid var(--ln);
      border-radius: 14px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      min-height: 640px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    .schema-viewport {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: top center;
    }
    .schema-viewport img {
      width: 100%;
      max-width: none;
      height: auto;
      display: block;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      background: #FFFFFF;
    }
    .schema-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      border: 1px solid var(--ln);
      border-radius: 10px;
      padding: 8px 14px;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .schema-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--ln);
      background: #FFFFFF;
      color: #1E293B;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .schema-btn:hover {
      background: #F1F5F9;
      border-color: #CBD5E1;
    }
    .schema-btn.primary {
      background: #1E40AF;
      color: #FFFFFF;
      border-color: #1E40AF;
    }
    .schema-btn.primary:hover {
      background: #1D4ED8;
    }
    .schema-zoom-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      background: #EFF6FF;
      color: #1E40AF;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid #BFDBFE;
    }
  </style>
</head>
<body>

  <!-- Top Global Switcher Bar -->
  <div class="top-nav">
    <div class="brand" data-go="splash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3c-2.8 0-5 2.2-5 5.2 0 2.3 1 3.6 1.5 6.2.4 2.4 1 6.6 2.7 6.6 1.6 0 1.5-4 3.8-4s2.2 4 3.8 4c1.7 0 2.3-4.2 2.7-6.6.5-2.6 1.5-3.9 1.5-6.2C21 5.2 18.8 3 16 3c-1.7 0-2.7 1-4 1S9.7 3 8 3z"/>
      </svg>
      <span>TeethLink <small style="font-weight:500;color:var(--gr)">· Dental Care Platform</small></span>
    </div>

    <div class="bar" id="roleBar">
      <!-- Injected dynamically: Patient, Student, Supervisor, Admin, Schemas -->
    </div>

    <div style="display:flex;align-items:center;gap:10px">
      <div class="live-badge" id="liveBadge">
        <span class="live-dot"></span>
        <span id="liveStatus">Connected</span>
      </div>
      <button class="chip" id="rtlBtn" style="margin:0">RTL / عربي</button>
    </div>
  </div>

  <!-- Main Viewport -->
  <div class="main-wrap">
    <div class="ph" id="ph">
      <div class="sc" id="sc">
        <!-- Rendered by app.js -->
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
